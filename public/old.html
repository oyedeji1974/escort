<script>
    const CACHE_TIME = 5 * 60 * 1000; // 5 minutes
let controller = null;
async function loadAds() {
    const list = document.getElementById('ads-list');
    const header = document.getElementById('city-heading');
    const urlParams = new URLSearchParams(window.location.search);
    const city = urlParams.get('city') || "";
    const cleanCity = decodeURIComponent(city).toUpperCase();

    // FIXED: Dynamic SEO & Metadata Engine to inject targeted content per city automatically
    if(city) {
        header.innerHTML = `Latest Listings in <span class="gold-text">${cleanCity}</span>`;

    }

    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const baseUrl = isLocal ? 'http://localhost:3000' : '';
    const fetchUrl = `${baseUrl}/api/ads${window.location.search}`;

const cacheKey = "ads-" + window.location.search;
const cached = localStorage.getItem(cacheKey);
    if (!cached) {
    list.innerHTML = `
    <div class="loading-state">
        <div class="loading-spinner"></div>
        <div>Fetching ads please wait...</div>
    </div>
    `;
    }
if (cached) {
    try {
        const cache = JSON.parse(cached);

        if (Date.now() - cache.time < CACHE_TIME) {
            renderAds(cache.data, list, city, baseUrl);
            return; // stop here
        }

        localStorage.removeItem(cacheKey);
    } catch {
        localStorage.removeItem(cacheKey);
    }
}

    try {
      // Cancel previous request if another starts
if (controller) controller.abort();

controller = new AbortController();

const res = await fetch(fetchUrl, {
    signal: controller.signal,
    cache: "no-cache"
});
        
        if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`Status ${res.status}: ${errorText}`);
        }

    const ads = await res.json();

localStorage.setItem(cacheKey, JSON.stringify({
    time: Date.now(),
    data: ads
}));

renderAds(ads, list, city, baseUrl);

} catch (err) {
    if (err.name === "AbortError") return;

    console.error("Fetch Error:", err);

    list.innerHTML = `

            <div class="error-icon"><i class="fa fa-exclamation-triangle"></i></div>
            <div class="error-title">Connection Interrupted</div>
            <div class="error-msg">${err.message}</div>
            <button class="retry-btn" onclick="location.reload()">Reload Area</button>
        </div>
    `;
}
}
