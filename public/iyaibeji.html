<body>

<div class="admin-header">
    <h1>⚙️ ADMIN PANEL</h1>
    <small>Manage and Delete Ads</small>
</div>

<div class="container">
    <div id="login-section" class="login-box">
        <h2>Admin Access</h2>
        <p style="color: #999; font-size: 13px;">Enter your admin password to access the dashboard</p>
        <input type="password" id="admin-password" placeholder="Admin Password" />
        <button onclick="adminLogin()">Login</button>
        <div id="login-error" style="color: var(--red); font-size: 12px; margin-top: 10px; display: none;"></div>
    </div>

    <div id="admin-section" class="ads-section">
        <button class="logout-btn" onclick="adminLogout()"><i class="fa fa-sign-out"></i> LOGOUT</button>

        <div class="alert-success" id="alert-success">✓ Ad deleted successfully!</div>
        <div class="alert-error" id="alert-error"></div>

        <div class="stats" id="stats-container"></div>

        <div class="filters">
            <input type="text" id="search-box" placeholder="Search by title, phone, city..." />
            <select id="city-filter">
                <option value="">All Cities</option>
            </select>
            <label style="display:flex; align-items:center; gap:8px; color:#333; font-size:13px;">
                <input type="checkbox" id="reported-filter" />
                Reported only
            </label>
            <button onclick="filterAds()"><i class="fa fa-filter"></i> Filter</button>
            <button onclick="loadAllAds()" style="background: #666;"><i class="fa fa-refresh"></i> Refresh</button>
            <button onclick="confirmDeleteAll()" style="background: #d32f2f;"><i class="fa fa-trash-alt"></i> Delete All</button>
            <button id="toggle-post-form-btn" onclick="togglePostForm()" style="background: #1a73e8;"><i class="fa fa-plus-circle"></i> New Post</button>
        </div>

        <div class="country-post-box">
            <h3>Admin: Post ad by country, state/province, or city</h3>
            <div class="field-grid">
                <div>
                    <label for="admin-post-scope">Post target</label>
                    <select id="admin-post-scope">
                        <option value="country">All cities in selected country</option>
                        <option value="region">All cities in selected state/province</option>
                        <option value="city">Selected city only</option>
                    </select>
                </div>
                <div>
                    <label for="admin-country-select">Country</label>
                    <select id="admin-country-select"></select>
                </div>
                <div>
                    <label for="admin-region-select">State / Province</label>
                    <select id="admin-region-select" disabled></select>
                </div>
                <div>
                    <label for="admin-city-select">City</label>
                    <select id="admin-city-select" disabled></select>
                </div>
                <div>
                    <label for="admin-category">Category</label>
                    <select id="admin-category">
                        <option value="regular-massage">Regular Massage</option>
                        <option value="bodyrubs">Bodyrubs</option>
                        <option value="male-massage-therapists">Male Massage Therapists</option>
                        <option value="female-massage-therapist">Female Massage Therapist</option>
                    </select>
                </div>
                <div>
                    <label for="admin-title">Title</label>
                    <input id="admin-title" type="text" placeholder="Catchy title..." />
                </div>
                <div>
                    <label for="admin-phone">Phone</label>
                    <input id="admin-phone" type="text" placeholder="Phone number" />
                </div>
                <div>
                    <label for="admin-price">Price</label>
                    <input id="admin-price" type="text" placeholder="$100" />
                </div>
                <div>
                    <label for="admin-age">Age</label>
                    <input id="admin-age" type="number" placeholder="21" />
                </div>
                <div>
                    <label for="admin-whatsapp">WhatsApp</label>
                    <input id="admin-whatsapp" type="text" placeholder="e.g. 15551234567" />
                </div>
                <div>
                    <label for="admin-telegram">Telegram</label>
                    <input id="admin-telegram" type="text" placeholder="Username" />
                </div>
                <div>
                    <label for="admin-snapchat">Snapchat</label>
                    <input id="admin-snapchat" type="text" placeholder="Username" />
                </div>
                <div class="full-width">
                    <label for="admin-image-input">Upload Images</label>
                    <input id="admin-image-input" type="file" accept="image/*" multiple />
                    <div id="admin-img-preview-box" class="image-preview-container"></div>
                </div>
                <div class="full-width">
                    <label for="admin-description">Description</label>
                    <textarea id="admin-description" placeholder="Describe your services..."></textarea>
                </div>
            </div>
            <button class="post-country-btn" onclick="postLocationAd()">Post Ad</button>
            <div id="country-status" class="country-status"></div>
        </div>

        <div id="ads-list"></div>
    </div>

    <div id="delete-modal" class="modal">
        <div class="modal-content">
            <h3>⚠️ Confirm Delete</h3>
            <p id="modal-ad-info"></p>
            <p style="font-size: 12px; color: #999;">This action cannot be undone.</p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-confirm-delete" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentAdminPassword = null;
    let currentDeleteId = null;
    let allAds = [];
    let adminImageArray = [];

    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const baseUrl = isLocal ? 'http://localhost:3000' : '';

    function adminLogin() {
        const password = document.getElementById('admin-password').value;
        if (!password) {
            showError('Please enter a password');
            return;
        }

        currentAdminPassword = password.trim();
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-section').classList.add('active');
        loadCountryOptions();
        loadAllAds();
    }

    function adminLogout() {
        currentAdminPassword = null;
        currentDeleteId = null;
        document.getElementById('admin-section').classList.remove('active');
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('admin-password').value = '';
        document.getElementById('ads-list').innerHTML = '';
        const postButton = document.getElementById('toggle-post-form-btn');
        if (postButton) {
            postButton.innerHTML = '<i class="fa fa-plus-circle"></i> New Post';
        }
        const postBox = document.querySelector('.country-post-box');
        if (postBox) {
            postBox.style.display = 'none';
        }
    }

    async function loadAllAds() {
        const list = document.getElementById('ads-list');
        list.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div>Loading ads...</div>';

        try {
            const cacheBuster = `&_cb=${new Date().getTime()}`;
            const res = await fetch(`${baseUrl}/api/admin/all-ads?admin=${encodeURIComponent(currentAdminPassword)}${cacheBuster}`);

            if (res.status === 401) {
                showError('Invalid admin password');
                adminLogout();
                return;
            }

            if (!res.ok) {
                throw new Error(`Status ${res.status}`);
            }

            allAds = await res.json();
            displayAds(allAds);
            updateStats();
            populateCityFilter();
        } catch (err) {
            showError('Failed to load ads: ' + err.message);
            list.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>Error loading ads</div>';
        }
    }

    function displayAds(ads) {
        const list = document.getElementById('ads-list');

        if (!ads || ads.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>No ads found</p></div>';
            return;
        }

        const tableHtml = `
            <table class="ads-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>City</th>
                        <th>Reports</th>
                        <th>Phone</th>
                        <th>Price</th>
                        <th>Posted</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${ads.map((ad, idx) => {
                        // FORCE AN ABSOLUTE STRING ID VALUE
                        let trackingId = '';
                        
                        if (ad) {
                            if (ad.adIdString && String(ad.adIdString) !== 'null' && String(ad.adIdString) !== 'undefined') {
                                trackingId = String(ad.adIdString);
                            } else if (ad._id) {
                                trackingId = typeof ad._id === 'object' && ad._id.$oid ? String(ad._id.$oid) : String(ad._id);
                            } else if (ad.id) {
                                trackingId = typeof ad.id === 'object' && ad.id.$oid ? String(ad.id.$oid) : String(ad.id);
                            }
                        }
                        
                        // Ultimate emergency escape hatch
                        if (!trackingId || trackingId === 'null' || trackingId === 'undefined') {
                            trackingId = ad.title ? encodeURIComponent(ad.title.trim()) : `index-${idx}`;
                        }

                        const safeTitle = (ad.title || 'Untitled').replace(/"/g, '&quot;');
                        
                        // Renamed data-ad-id attribute to data-secure-id to smash old browser/Vercel DOM caches
                        return `
                        <tr>
                            <td class="ad-title">${ad.title || 'Untitled'}</td>
                            <td class="ad-city">${ad.city || 'N/A'}</td>
                            <td>${ad.reports || 0}</td>
                            <td class="ad-phone">${ad.phone || 'N/A'}</td>
                            <td class="ad-price">$${ad.price || '0'}</td>
                            <td>${formatDate(ad.createdAt)}</td>
                            <td><button class="delete-btn" data-secure-id="${trackingId}" data-ad-title="${safeTitle}"> <i class="fa fa-trash"></i> Delete</button></td>
                        </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
        list.innerHTML = tableHtml;

        document.querySelectorAll('.delete-btn').forEach(button => {
            button.addEventListener('click', () => {
                const secureId = button.getAttribute('data-secure-id');
                const adTitle = button.getAttribute('data-ad-title') || 'Untitled';
                openDeleteModal(secureId, adTitle);
            });
        });
    }

    function formatDate(dateString) {
        if(!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function updateStats() {
        const stats = document.getElementById('stats-container');
        const totalAds = allAds.length;
        const cities = new Set(allAds.map(ad => ad.city || 'unknown')).size;
        const reportedAds = allAds.filter(ad => (ad.reports || 0) > 0).length;

        stats.innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${totalAds}</div>
                <div class="stat-label">Total Ads</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${cities}</div>
                <div class="stat-label">Cities</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${reportedAds}</div>
                <div class="stat-label">Reported Ads</div>
            </div>
        `;
    }

    function populateCityFilter() {
        const select = document.getElementById('city-filter');
        select.innerHTML = '<option value="">All Cities</option>';
        
        const cities = [...new Set(allAds.map(ad => ad.city).filter(Boolean))].sort();

        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city.toUpperCase();
            select.appendChild(option);
        });
    }

    function filterAds() {
        const search = document.getElementById('search-box').value.toLowerCase();
        const city = document.getElementById('city-filter').value;
        const reportedOnly = document.getElementById('reported-filter').checked;

        const filtered = allAds.filter(ad => {
            const titleText = (ad.title || '').toLowerCase();
            const phoneText = ad.phone || '';
            const cityText = (ad.city || '').toLowerCase();
            const reportCount = ad.reports || 0;

            const matchesSearch = !search || 
                titleText.includes(search) ||
                phoneText.includes(search) ||
                cityText.includes(search);

            const matchesCity = !city || ad.city === city;
            const matchesReports = !reportedOnly || reportCount > 0;

            return matchesSearch && matchesCity && matchesReports;
        });

        displayAds(filtered);
    }

    function openDeleteModal(adId, adTitle) {
        currentDeleteId = null;
        if (!adId || adId === 'null' || adId === 'undefined') {
            showError("System internal error: Failed to map a proper identifier reference.");
            return;
        }
        currentDeleteId = adId;
        document.getElementById('modal-ad-info').textContent = `Delete ad: "${adTitle}"?`;
        document.getElementById('delete-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('delete-modal').classList.remove('active');
        currentDeleteId = null;
    }

    async function confirmDelete() {
        if (!currentDeleteId || currentDeleteId === 'null' || currentDeleteId === 'undefined') {
            showError("Could not delete: Tracking identifier is corrupt.");
            closeModal();
            return;
        }

        const deletionTarget = currentDeleteId;
        closeModal();

        try {
            const res = await fetch(`${baseUrl}/api/ads/${deletionTarget}?admin=${encodeURIComponent(currentAdminPassword)}`, {
                method: 'DELETE'
            });

            if (res.status === 401) {
                showError('Invalid admin password');
                adminLogout();
                return;
            }

            if (!res.ok) {
                const body = await res.text();
                throw new Error(`Delete failed with status ${res.status}: ${body}`);
            }

            showSuccess('Ad deleted successfully!');
            await loadAllAds();
        } catch (err) {
            showError('Failed to delete ad: ' + err.message);
        }
    }

    async function deleteAllAds() {
        try {
            const res = await fetch(`${baseUrl}/api/admin/delete-all?admin=${encodeURIComponent(currentAdminPassword)}`, {
                method: 'DELETE'
            });

            if (res.status === 401) {
                showError('Invalid admin password');
                adminLogout();
                return;
            }

            if (!res.ok) {
                const body = await res.text();
                throw new Error(`Delete all failed with status ${res.status}: ${body}`);
            }

            const result = await res.json();
            showSuccess(result.message || 'All ads deleted successfully!');
            await loadAllAds();
        } catch (err) {
            showError('Failed to delete all ads: ' + err.message);
        }
    }

    function confirmDeleteAll() {
        if (!currentAdminPassword) {
            showError('You must log in first.');
            return;
        }

        const confirmed = confirm('Delete ALL ads permanently? This cannot be undone.');
        if (!confirmed) return;

        deleteAllAds();
    }

    function showError(message) {
        const alert = document.getElementById('alert-error');
        alert.textContent = '✗ ' + message;
        alert.classList.add('show');
        setTimeout(() => alert.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
        const alert = document.getElementById('alert-success');
        alert.textContent = message;
        alert.classList.add('show');
        setTimeout(() => alert.classList.remove('show'), 5000);
    }

    function togglePostForm() {
        const postBox = document.querySelector('.country-post-box');
        const button = document.getElementById('toggle-post-form-btn');
        if (!postBox || !button) return;

        const isVisible = postBox.style.display === 'block';
        postBox.style.display = isVisible ? 'none' : 'block';
        button.innerHTML = isVisible ? '<i class="fa fa-plus-circle"></i> New Post' : '<i class="fa fa-times-circle"></i> Close Form';
    }

        function initLocationControls() {

            countrySelect.addEventListener('change', () => {

        function updateLocationFieldState() {
            const scope = document.getElementById('admin-post-scope').value;
            const country = document.getElementById('admin-country-select').value;
            const regionSelect = document.getElementById('admin-region-select');
            const citySelect = document.getElementById('admin-city-select');

            if (scope === 'country') {
                regionSelect.disabled = true;
                citySelect.disabled = true;
            } else if (scope === 'region') {
                regionSelect.disabled = !country;
                citySelect.disabled = true;
            } else {
                regionSelect.disabled = !country;
                citySelect.disabled = !country || !regionSelect.value;
            }
        }

        function populateRegionOptions(country) {
            const select = document.getElementById('admin-region-select');
            select.innerHTML = '<option value="">Select a state / province</option>';
            select.disabled = true;

            if (!country || typeof locations === 'undefined' || !locations[country]) {
                return;
            }

            const regions = Object.keys(locations[country]).sort();
            regions.forEach(region => {
                const option = document.createElement('option');
                option.value = region;
                option.textContent = region.replace(/([A-Z])/g, ' $1').trim();
                select.appendChild(option);

            select.disabled = false;

        function populateCityOptions(country, region) {
            const select = document.getElementById('admin-city-select');

            const cities = [...locations[country][region]].sort((a, b) => a.localeCompare(b));

                option.value = city;
                option.textContent = city;
                select.appendChild(option);

<script>
    let currentAdminPassword = null;
    let currentDeleteId = null;
    let allAds = [];
    let allUsers = []; 
    let adminImageArray = [];
    let currentViewMode = 'ads'; 

    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const baseUrl = isLocal ? 'http://localhost:3000' : '';

    function adminLogin() {
        const password = document.getElementById('admin-password').value;
        if (!password) {
            showError('Please enter a password');
            return;
        }

        currentAdminPassword = password.trim();
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-section').classList.add('active');
        
        setupAdminSubNavigation();
        loadCountryOptions();
        loadAllAds();
    }

    function adminLogout() {
        currentAdminPassword = null;
        currentDeleteId = null;
        allAds = [];
        allUsers = [];
        currentViewMode = 'ads';
        document.getElementById('admin-section').classList.remove('active');
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('admin-password').value = '';
        document.getElementById('ads-list').innerHTML = '';
        const postButton = document.getElementById('toggle-post-form-btn');
        if (postButton) {
            postButton.innerHTML = '<i class="fa fa-plus-circle"></i> New Post';
        }
        const postBox = document.querySelector('.country-post-box');
        if (postBox) {
            postBox.style.display = 'none';
        }
    }

    function setupAdminSubNavigation() {
        let controlsContainer = document.getElementById('admin-view-controls');
        if (!controlsContainer) {
            const statsContainer = document.getElementById('stats-container');
            controlsContainer = document.createElement('div');
            controlsContainer.id = 'admin-view-controls';
            controlsContainer.style.margin = '15px 0';
            controlsContainer.style.display = 'flex';
            controlsContainer.style.gap = '10px';
            
            controlsContainer.innerHTML = `
                <button id="view-ads-tab-btn" class="delete-btn" style="background:#007bff; max-width:200px;" onclick="switchAdminView('ads')"><i class="fa fa-list"></i> Manage All Ads</button>
                <button id="view-users-tab-btn" class="delete-btn" style="background:#28a745; max-width:200px;" onclick="switchAdminView('users')"><i class="fa fa-users"></i> Registered Users</button>
            `;
            if(statsContainer) {
                statsContainer.parentNode.insertBefore(controlsContainer, statsContainer.nextSibling);
            }
        }
    }

    function switchAdminView(mode) {
        currentViewMode = mode;
        const adsBtn = document.getElementById('view-ads-tab-btn');
        const usersBtn = document.getElementById('view-users-tab-btn');
        
        if(mode === 'ads') {
            if(adsBtn) adsBtn.style.opacity = '1';
            if(usersBtn) usersBtn.style.opacity = '0.6';
            displayAds(allAds);
        } else {
            if(adsBtn) adsBtn.style.opacity = '0.6';
            if(usersBtn) usersBtn.style.opacity = '1';
            loadAllUsers();
        }
    }

    async function loadAllAds() {
        const list = document.getElementById('ads-list');
        if(currentViewMode === 'ads') {
            list.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div>Loading ads...</div>';
        }

        try {
            const cacheBuster = `&_cb=${new Date().getTime()}`;
            const res = await fetch(`${baseUrl}/api/admin/all-ads?admin=${encodeURIComponent(currentAdminPassword)}${cacheBuster}`);

            if (res.status === 401) {
                showError('Invalid admin password');
                adminLogout();
                return;
            }

            if (!res.ok) throw new Error(`Status ${res.status}`);

            allAds = await res.json();
            if(currentViewMode === 'ads') {
                displayAds(allAds);
            }
            updateStats();
            populateCityFilter();
        } catch (err) {
            showError('Failed to load ads: ' + err.message);
            if(currentViewMode === 'ads') {
                list.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>Error loading ads</div>';
            }
        }
    }

    async function loadAllUsers() {
        const list = document.getElementById('ads-list');
        list.innerHTML = '<div class="loading-state"><div class="loading-spinner"></div>Loading registered user records...</div>';

        try {
            const cacheBuster = `&_cb=${new Date().getTime()}`;
            const res = await fetch(`${baseUrl}/api/admin/all-users?admin=${encodeURIComponent(currentAdminPassword)}${cacheBuster}`);

            if (res.status === 401) {
                showError('Invalid admin password');
                adminLogout();
                return;
            }

            if (!res.ok) throw new Error(`Status ${res.status}`);

            allUsers = await res.json();
            displayUsers(allUsers);
        } catch (err) {
            showError('Failed to load user list: ' + err.message);
            list.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>Error loading users</div>';
        }
    }

    function displayUsers(users) {
        const list = document.getElementById('ads-list');

        if (!users || users.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><p>No registered users found</p></div>';
            return;
        }

        const tableHtml = `
            <div style="margin-bottom: 10px; font-weight: bold; color: var(--text-color, #333);">Registered Users Directory</div>
            <table class="ads-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email Account</th>
                        <th>Registered Phone</th>
                        <th>Joined Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${users.map((user) => {
                        const safeEmail = (user.email || 'N/A').replace(/"/g, '&quot;');
                        const safePhone = (user.phone || '').trim();
                        return `
                        <tr>
                            <td><b>${user.name || 'Anonymous'}</b></td>
                            <td>${user.email || 'N/A'}</td>
                            <td>${user.phone || 'N/A'}</td>
                            <td>${formatDate(user.createdAt)}</td>
                            <td>
                                <button class="delete-btn" style="background:#007bff;" onclick="viewAdsByUserPhone('${safePhone}', '${safeEmail}')">
                                    <i class="fa fa-eye"></i> View Ads
                                </button>
                            </td>
                        </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
        list.innerHTML = tableHtml;
    }

    function viewAdsByUserPhone(phoneString, userEmail) {
        if (!phoneString) {
            showError("This account has no linked phone index key to parse tracking data.");
            return;
        }

        const normalizedPhone = phoneString.toLowerCase().trim();
        
        const matchedAds = allAds.filter(ad => {
            const adPhone = ad.phone ? String(ad.phone).toLowerCase().trim() : '';
            return adPhone === normalizedPhone && normalizedPhone !== '';
        });

        currentViewMode = 'ads';
        const adsBtn = document.getElementById('view-ads-tab-btn');
        const usersBtn = document.getElementById('view-users-tab-btn');
        if(adsBtn) adsBtn.style.opacity = '1';
        if(usersBtn) usersBtn.style.opacity = '0.6';

        displayAds(matchedAds);

        const list = document.getElementById('ads-list');
        const noticeHeader = document.createElement('div');
        noticeHeader.style.padding = '12px';
        noticeHeader.style.marginBottom = '15px';
        noticeHeader.style.background = '#e1f5fe';
        noticeHeader.style.border = '1px solid #b3e5fc';
        noticeHeader.style.borderRadius = '4px';
        noticeHeader.style.display = 'flex';
        noticeHeader.style.justify = 'space-between';
        noticeHeader.style.alignItems = 'center';
        noticeHeader.style.color = '#0288d1';

        noticeHeader.innerHTML = `
            <span>Showing <b>${matchedAds.length}</b> ads posted by user: <b>${userEmail}</b> (Phone: ${phoneString})</span>
            <button class="delete-btn" style="max-width:120px; margin:0; padding:5px 10px; background:#6c757d;" onclick="switchAdminView('users')">← Back to Users</button>
        `;
        list.insertBefore(noticeHeader, list.firstChild);
    }

    function displayAds(ads) {
        const list = document.getElementById('ads-list');

        if (!ads || ads.length === 0) {
            list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>No ads found</p></div>';
            return;
        }

        const tableHtml = `
            <table class="ads-table">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>City</th>
                        <th>Reports</th>
                        <th>Phone</th>
                        <th>Price</th>
                        <th>Posted</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    ${ads.map((ad, idx) => {
                        let trackingId = '';
                        
                        if (ad) {
                            if (ad.adIdString && String(ad.adIdString) !== 'null' && String(ad.adIdString) !== 'undefined') {
                                trackingId = String(ad.adIdString);
                            } else if (ad._id) {
                                trackingId = typeof ad._id === 'object' && ad._id.$oid ? String(ad._id.$oid) : String(ad._id);
                            } else if (ad.id) {
                                trackingId = typeof ad.id === 'object' && ad.id.$oid ? String(ad.id.$oid) : String(ad.id);
                            }
                        }
                        
                        if (!trackingId || trackingId === 'null' || trackingId === 'undefined') {
                            trackingId = ad.title ? encodeURIComponent(ad.title.trim()) : `index-${idx}`;
                        }

                        const safeTitle = (ad.title || 'Untitled').replace(/"/g, '&quot;');
                        
                        return `
                        <tr>
                            <td class="ad-title">${ad.title || 'Untitled'}</td>
                            <td class="ad-city">${ad.city || 'N/A'}</td>
                            <td>${ad.reports || 0}</td>
                            <td class="ad-phone">${ad.phone || 'N/A'}</td>
                            <td class="ad-price">$${ad.price || '0'}</td>
                            <td>${formatDate(ad.createdAt)}</td>
                            <td><button class="delete-btn" data-secure-id="${trackingId}" data-ad-title="${safeTitle}"> <i class="fa fa-trash"></i> Delete</button></td>
                        </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
        list.innerHTML = tableHtml;

        document.querySelectorAll('.delete-btn').forEach(button => {
            if(button.getAttribute('data-secure-id')) {
                button.addEventListener('click', () => {
                    const secureId = button.getAttribute('data-secure-id');
                    const adTitle = button.getAttribute('data-ad-title') || 'Untitled';
                    openDeleteModal(secureId, adTitle);
                });
            }
        });
    }

    function formatDate(dateString) {
        if(!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }

    function updateStats() {
        const stats = document.getElementById('stats-container');
        if(!stats) return;
        const totalAds = allAds.length;
        const cities = new Set(allAds.map(ad => ad.city || 'unknown')).size;
        const reportedAds = allAds.filter(ad => (ad.reports || 0) > 0).length;

        stats.innerHTML = `
            <div class="stat-card">
                <div class="stat-value">${totalAds}</div>
                <div class="stat-label">Total Ads</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${cities}</div>
                <div class="stat-label">Cities</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">${reportedAds}</div>
                <div class="stat-label">Reported Ads</div>
            </div>
        `;
    }

    function populateCityFilter() {
        const select = document.getElementById('city-filter');
        if(!select) return;
        select.innerHTML = '<option value="">All Cities</option>';
        
        const cities = [...new Set(allAds.map(ad => ad.city).filter(Boolean))].sort();

        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city.toUpperCase();
            select.appendChild(option);
        });
    }

    function filterAds() {
        const search = document.getElementById('search-box').value.toLowerCase();
        const city = document.getElementById('city-filter').value;
        const reportedOnly = document.getElementById('reported-filter').checked;

        const filtered = allAds.filter(ad => {
            const titleText = (ad.title || '').toLowerCase();
            const phoneText = ad.phone || '';
            const cityText = (ad.city || '').toLowerCase();
            const reportCount = ad.reports || 0;

            const matchesSearch = !search || 
                titleText.includes(search) ||
                phoneText.includes(search) ||
                cityText.includes(search);

            const matchesCity = !city || ad.city === city;
            const matchesReports = !reportedOnly || reportCount > 0;

            return matchesSearch && matchesCity && matchesReports;
        });

        currentViewMode = 'ads';
        displayAds(filtered);
    }

    function openDeleteModal(adId, adTitle) {
        currentDeleteId = null;
        if (!adId || adId === 'null' || adId === 'undefined') {
            showError("System internal error: Failed to map a proper identifier reference.");
            return;
        }
        currentDeleteId = adId;
        document.getElementById('modal-ad-info').textContent = `Delete ad: "${adTitle}"?`;
        document.getElementById('delete-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('delete-modal').classList.remove('active');
        currentDeleteId = null;
    }

    async function confirmDelete() {
        if (!currentDeleteId || currentDeleteId === 'null' || currentDeleteId === 'undefined') {
            showError("Could not delete: Tracking identifier is corrupt.");
            return;
        }

        const deletionTarget = currentDeleteId;
        closeModal();

        try {
            const res = await fetch(`${baseUrl}/api/ads/${deletionTarget}?admin=${encodeURIComponent(currentAdminPassword)}`, {
                method: 'DELETE'
            });

            if (res.status === 401) {
                showError('Invalid admin password');
                adminLogout();
                return;
            }

            if (!res.ok) {
                const body = await res.text();
                throw new Error(`Delete failed with status ${res.status}: ${body}`);
            }

            showSuccess('Ad deleted successfully!');
            await loadAllAds();
            if(currentViewMode === 'users') {
                loadAllUsers();
            }
        } catch (err) {
            showError('Failed to delete ad: ' + err.message);
        }
    }

    async function deleteAllAds() {
        try {
            const res = await fetch(`${baseUrl}/api/admin/delete-all?admin=${encodeURIComponent(currentAdminPassword)}`, {
                method: 'DELETE'
            });

            if (res.status === 401) {
                showError('Invalid admin password');
                adminLogout();
                return;
            }

            if (!res.ok) {
                const body = await res.text();
                throw new Error(`Delete all failed with status ${res.status}: ${body}`);
            }

            const result = await res.json();
            showSuccess(result.message || 'All ads deleted successfully!');
            await loadAllAds();
        } catch (err) {
            showError('Failed to delete all ads: ' + err.message);
        }
    }

    function confirmDeleteAll() {
        if (!currentAdminPassword) {
            showError('You must log in first.');
            return;
        }

        const confirmed = confirm('Delete ALL ads permanently? This cannot be undone.');
        if (!confirmed) return;

        deleteAllAds();
    }

    function showError(message) {
        const alert = document.getElementById('alert-error');
        if(!alert) { alert(message); return; }
        alert.textContent = '✗ ' + message;
        alert.classList.add('show');
        setTimeout(() => alert.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
        const alert = document.getElementById('alert-success');
        if(!alert) return;
        alert.textContent = message;
        alert.classList.add('show');
        setTimeout(() => alert.classList.remove('show'), 5000);
    }

    function togglePostForm() {
        const postBox = document.querySelector('.country-post-box');
        const button = document.getElementById('toggle-post-form-btn');
        if (!postBox || !button) return;

        const isVisible = postBox.style.display === 'block';
        postBox.style.display = isVisible ? 'none' : 'block';
        button.innerHTML = isVisible ? '<i class="fa fa-plus-circle"></i> New Post' : '<i class="fa fa-times-circle"></i> Close Form';
    }
</script>

<script src="location.js"></script>
<script>
    const API_ENDPOINT = isLocal ? 'http://localhost:3000/api/ads' : '/api/ads';
    document.getElementById('admin-image-input').onchange = function(e) {
        const files = Array.from(e.target.files);
        const previewBox = document.getElementById('admin-img-preview-box');
        previewBox.innerHTML = '';
        adminImageArray = [];

        if (files.length > 2) {
            alert('Max 2 photos. Please choose 1 or 2 images.');
            e.target.value = '';
            return;
        }

        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 600;
                    canvas.height = (img.height / img.width) * 600;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const dataurl = canvas.toDataURL('image/jpeg', 0.6);
                    adminImageArray.push(dataurl);
                    previewBox.innerHTML += `<img src="${dataurl}" class="preview-img-item">`;
                };
            };
            reader.readAsDataURL(file);
        });
    };

    function loadCountryOptions() {
        const select = document.getElementById('admin-country-select');
        if (typeof locations === 'undefined') {
            select.innerHTML = '<option value="">Location data unavailable</option>';
            return;
        }

        const countryNames = {
            usa: 'United States',
            canada: 'Canada',
            europe: 'Europe',
            asia: 'Asia & Middle East',
            latinamerica: 'Latin America',
            oceania: 'Australia'
        };

        select.innerHTML = '<option value="">Select a country</option>';
        Object.keys(locations).sort().forEach(key => {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = countryNames[key] || key;
            select.appendChild(option);
        });

        initLocationControls();
    }

    function initLocationControls() {
        const scopeSelect = document.getElementById('admin-post-scope');
        const countrySelect = document.getElementById('admin-country-select');
        const regionSelect = document.getElementById('admin-region-select');
        const citySelect = document.getElementById('admin-city-select');

        if (!scopeSelect || !countrySelect || !regionSelect || !citySelect) return;

        scopeSelect.addEventListener('change', () => {
            updateLocationFieldState();
        });

        countrySelect.addEventListener('change', () => {
            populateRegionOptions(countrySelect.value);
            updateLocationFieldState();
        });

        regionSelect.addEventListener('change', () => {
            populateCityOptions(countrySelect.value, regionSelect.value);
            updateLocationFieldState();
        });

        updateLocationFieldState();
    }

    function updateLocationFieldState() {
        const scope = document.getElementById('admin-post-scope').value;
        const country = document.getElementById('admin-country-select').value;
        const regionSelect = document.getElementById('admin-region-select');
        const citySelect = document.getElementById('admin-city-select');

        if (scope === 'country') {
            regionSelect.disabled = true;
            citySelect.disabled = true;
        } else if (scope === 'region') {
            regionSelect.disabled = !country;
            citySelect.disabled = true;
        } else {
            regionSelect.disabled = !country;
            citySelect.disabled = !country || !regionSelect.value;
        }
    }

    function populateRegionOptions(country) {
        const select = document.getElementById('admin-region-select');
        select.innerHTML = '<option value="">Select a state / province</option>';
        select.disabled = true;

        if (!country || typeof locations === 'undefined' || !locations[country]) {
            return;
        }

        const regions = Object.keys(locations[country]).sort();
        regions.forEach(region => {
            const option = document.createElement('option');
            option.value = region;
            option.textContent = region.replace(/([A-Z])/g, ' $1').trim();
            select.appendChild(option);
        });

        select.disabled = false;
    }

    function populateCityOptions(country, region) {
        const select = document.getElementById('admin-city-select');
        select.innerHTML = '<option value="">Select a city</option>';
        select.disabled = true;

        if (!country || !region || typeof locations === 'undefined' || !locations[country] || !locations[country][region]) {
            return;
        }

        const cities = [...locations[country][region]].sort((a, b) => a.localeCompare(b));
        cities.forEach(city => {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            select.appendChild(option);
        });

        select.disabled = false;
    }

    async function postLocationAd() {
        const scope = document.getElementById('admin-post-scope').value;
        const country = document.getElementById('admin-country-select').value;
        const region = document.getElementById('admin-region-select').value;
        const city = document.getElementById('admin-city-select').value;
        const title = document.getElementById('admin-title').value.trim();
        const description = document.getElementById('admin-description').value.trim();
        const category = document.getElementById('admin-category-select').value;
        const price = document.getElementById('admin-price').value.trim();
        const age = document.getElementById('admin-age').value.trim();
        const phone = document.getElementById('admin-phone').value.trim();
        const whatsapp = document.getElementById('admin-whatsapp').value.trim();
        const telegram = document.getElementById('admin-telegram').value.trim();
        const snapchat = document.getElementById('admin-snapchat').value.trim();
        const status = document.getElementById('country-status');

        if (!country) {
            status.textContent = 'Please select a country.';
            return;
        }
        if (!title || !description || !phone) {
            status.textContent = 'Title, description, and phone are required.';
            return;
        }
        if (typeof locations === 'undefined' || !locations[country]) {
            status.textContent = 'No location data found for the selected country.';
            return;
        }

        let cities = [];
        if (scope === 'country') {
            cities = Object.values(locations[country]).flat();
        } else if (scope === 'region') {
            if (!region) {
                status.textContent = 'Please select a state / province.';
                return;
            }
            cities = locations[country][region] || [];
        } else {
            if (!region || !city) {
                status.textContent = 'Please select a state / province and a city.';
                return;
            }
            cities = [city];
        }

        cities = [...new Set(cities.map(c => c.toLowerCase().trim()))].filter(Boolean);
        if (!cities.length) {
            status.textContent = 'No cities found for the selected target.';
            return;
        }

        status.textContent = `Posting to ${cities.length} ${cities.length === 1 ? 'city' : 'cities'}...`;
        const promises = cities.map(cityName => {
            const adData = {
                city: cityName,
                category,
                title,
                description,
                content: description,
                price,
                age,
                phone,
                whatsapp,
                telegram,
                snapchat,
                images: adminImageArray
            };

            return fetch(API_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(adData)
            }).then(res => ({ city: cityName, ok: res.ok, status: res.status }));
        });

        const results = await Promise.all(promises);
        const failed = results.filter(r => !r.ok);
        if (failed.length === 0) {
            status.textContent = `Successfully posted to ${cities.length} ${cities.length === 1 ? 'city' : 'cities'}.`;
            loadAllAds();
        } else {
            status.textContent = `Posted to ${cities.length - failed.length} ${cities.length - failed.length === 1 ? 'city' : 'cities'}, failed in ${failed.length}.`;
            console.error('Location post failed for cities:', failed);
            loadAllAds();
        }
    }
</script>
</body>
</html>
