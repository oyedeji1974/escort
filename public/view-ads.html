<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="public, max-age=86400">

<title id="pageTitle">Nesolist</title>
<meta id="pageDescription" name="description" content="">

<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="/api">
<link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="//fonts.googleapis.com">

<link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></noscript>
<style>
:root {
    --primary: #ff5722;
    --primary-dark: #d84315;
    --surface: #ffffff;
    --surface-alt: #fff6f2;
    --text: #111111;
    --muted: #6b6763;
    --border: #f2ddd2;
}

* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #fffaf7 0%, #fff6f2 100%);
    color: var(--text);
}

header {
    background: #111111;
    color: #fff;
    padding: 16px 20px;
    font-size: 22px;
    font-weight: 700;
    border-bottom: 3px solid var(--primary);
}

#results {
    max-width: 860px;
    margin: auto;
    padding: 20px;
}

.loading, .noAds {
    text-align: center;
    padding: 50px 20px;
    font-size: 18px;
    color: var(--muted);
}

.spinner {
    width: 40px;
    height: 40px;
    margin: 0 auto 16px auto;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.ad {
    display: block;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 12px;
    text-decoration: none;
    color: var(--text);
    background: var(--surface);
    box-shadow: 0 8px 20px rgba(17, 17, 17, 0.04);
    transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}

.ad:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(17, 17, 17, 0.08);
    border-color: #ffc8b0;
}

.title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
}

@media (max-width: 600px) {
    header {
        font-size: 20px;
        padding: 14px 16px;
    }

    #results {
        padding: 14px;
    }

    .ad {
        padding: 14px 15px;
    }
}
</style>
</head>

<body>

<header id="heading">
Latest Listings
</header>

<div id="results">

<div class="loading" id="loading-indicator">
  <div class="spinner"></div>
  <div>Loading ads...</div>
</div>

</div>

<script defer>

const CACHE_TTL = 5 * 60 * 1000; // 5 minutes
const FETCH_TIMEOUT = 8000; // 8 seconds

const params = new URLSearchParams(window.location.search);
const city = params.get("city") || "";
const cat = params.get("cat") || "";
const limit = params.get("limit") || "50";

const isLocal =
location.hostname==="localhost" ||
location.hostname==="127.0.0.1";

const baseUrl = isLocal
? "http://localhost:3000"
: "";

const api =
`${baseUrl}/api/ads?city=${encodeURIComponent(city)}&cat=${encodeURIComponent(cat)}&limit=${encodeURIComponent(limit)}`;

loadAds();

async function loadAds(){
  const results = document.getElementById("results");
  const cacheKey = `view-ads:${api}`;

  // Try cache first
  try {
    const cached = sessionStorage.getItem(cacheKey);
    if (cached) {
      const { data, timestamp } = JSON.parse(cached);
      if (Date.now() - timestamp < CACHE_TTL) {
        renderAds(data);
        return;
      }
      sessionStorage.removeItem(cacheKey);
    }
  } catch (_) {}

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT);

    const res = await fetch(api, { signal: controller.signal });
    clearTimeout(timeoutId);

    const ads = await res.json();
    renderAds(ads);

    // Store in cache
    try {
      sessionStorage.setItem(cacheKey, JSON.stringify({ data: ads, timestamp: Date.now() }));
    } catch (_) {}
  }
  catch(err){
    results.innerHTML = `
    <div class="noAds">
    Unable to load ads.
    </div>
    `;
    console.error(err);
  }
}

function renderAds(ads){
  const results = document.getElementById("results");

  if(!ads || ads.length === 0){
    results.innerHTML = `
    <div class="noAds">
    No ads found.
    </div>
    `;
    return;
  }

  results.innerHTML = ads.map(ad => {
    const id = ad._id || ad.id;
    return `
    <a class="ad" href="ad.html?id=${id}">
      <div class="title">
        ${escapeHtml(ad.title || "Untitled")}
      </div>
    </a>
    `;
  }).join("");
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}
</script>

</body>
</html>
